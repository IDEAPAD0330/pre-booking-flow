
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Booking Flow</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      background: #f3f6fb;
      color: #222;
      text-align: center;
    }

    .content {
      margin: 0 auto;
      max-width: 900px;
      min-height: 430px;
      background: #ffffff;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      text-align: left;
    }

    h1, h2 {
      text-align: center;
      color: #1f3a5f;
      margin-top: 0;
    }

    p {
      font-size: 17px;
      line-height: 1.6;
    }

    ul {
      font-size: 17px;
      line-height: 1.7;
      padding-left: 25px;
    }

    li {
      margin-bottom: 10px;
    }

    .selection-screen {
      text-align: center;
    }

    .selection-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-top: 35px;
    }

    .choice-btn {
      padding: 35px 20px;
      font-size: 24px;
      font-weight: bold;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      color: white;
      min-height: 130px;
      transition: 0.2s ease;
      box-shadow: 0 6px 16px rgba(0,0,0,0.12);
    }

    .choice-btn:hover {
      transform: translateY(-3px);
      opacity: 0.95;
    }

    .hotel-btn {
      background: #8e44ad;
    }

    .car-btn {
      background: #f39c12;
    }

    .flight-btn {
      background: #3498db;
    }

    .disclosure-box {
      background: #f8fbff;
      border-left: 5px solid #3498db;
      padding: 18px 20px;
      border-radius: 8px;
      margin-top: 20px;
    }

    .disclosure-box p {
      margin: 12px 0;
    }

    .progress {
      max-width: 900px;
      margin: 0 auto 15px auto;
      font-size: 15px;
      font-weight: bold;
      color: #555;
      text-align: right;
      min-height: 18px;
    }

    .buttons {
      margin-top: 25px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: white;
      transition: 0.2s ease;
      min-width: 120px;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    #prevBtn {
      background-color: #e74c3c;
    }

    #nextBtn {
      background-color: #2ecc71;
    }

    #backBtn, #homeBtn {
      background-color: #3498db;
    }

    .small-note {
      font-size: 14px;
      color: #666;
      text-align: center;
      margin-top: 15px;
    }

    @media (max-width: 700px) {
      body {
        padding: 20px 10px;
      }

      .content {
        padding: 25px 20px;
      }

      p, ul {
        font-size: 16px;
      }

      .selection-buttons {
        grid-template-columns: 1fr;
      }

      button {
        width: 100%;
      }

      .buttons {
        flex-direction: column;
        max-width: 900px;
        margin-left: auto;
        margin-right: auto;
      }
    }
  </style>
</head>
<body>
  <div class="progress" id="progressText"></div>

  <div class="content" id="pageContent"></div>

  <div class="buttons" id="navigationButtons">
    <button id="homeBtn" onclick="showHome()">Home</button>
    <button id="prevBtn" onclick="prevPage()">Prev</button>
    <button id="backBtn" onclick="goToFirst()">Back to 1</button>
    <button id="nextBtn" onclick="nextPage()">Next</button>
  </div>

  <p class="small-note" id="tipText">Tip: You can also use your left and right arrow keys to move between flight steps.</p>

  <script>
    const homePage = `
      <div class="selection-screen">
        <h1>Booking Flow</h1>
        <p>Please select the booking type:</p>
        <div class="selection-buttons">
          <button class="choice-btn hotel-btn" onclick="showHotel()">Hotel</button>
          <button class="choice-btn car-btn" onclick="showCar()">Cars</button>
          <button class="choice-btn flight-btn" onclick="showFlight()">Flight</button>
        </div>
      </div>
    `;

    const hotelPage = `
      <h2>Mandatory Disclosures</h2>
      <div class="disclosure-box">
        <p>"The lead guest should be present and provide a government-issued photo ID upon check-in."</p>
        <p>"Please be advised that all special requests are subject to availability and are not guaranteed until check-in."</p>
        <p>"Please be advised that all rates are not guaranteed unless the reservation is confirmed."</p>
        <p>"You may cancel the reservation and make a new one, but after it has been confirmed, it cannot be modified. The amount of the refund will depend on the cancellation policy we previously agreed on."</p>
      </div>
    `;

    const carPage = `
      <h2>Mandatory Disclosures</h2>
      <div class="disclosure-box">
        <p>"In addition, the driver's age should be 25 or above. However, an additional fee may apply if the driver is below 25 years of age."</p>
        <p>"Once the reservation has been confirmed, it cannot be changed. You may cancel the booking and book a new one. The amount of the refund will depend on the cancellation policy we previously discussed."</p>
        <p>"Please keep in mind that you will receive a confirmation email within 12 hours if your booking was accepted or rejected, and changing dates or vehicles is not possible. If you need to upgrade your vehicle, you must contact the car rental company directly."</p>
        <p>"A major credit card should be in the name of the driver, with enough funds to cover the deposit and fees."</p>
        <p>"A valid driver's license in the name of the person who will be driving is required."</p>
        <p>"Insurance proof approved by the agency is required, or you may purchase insurance directly from the agency. Do not purchase or add insurance for bookings made over the phone."</p>
      </div>
    `;

    const flightPages = [
      `<h2>Pre-Booking Flow</h2>`,
      `<h2>1. Inform the AAB Fee</h2>
<p>Before we proceed, I must indicate that there will be an airline travel advisor fee for this transaction over the phone.</p>
<p>and Insurance cannot be purchased during this call; it must be purchased by booking online or separately through our preferred supplier.</p>
<p>Are you okay with that?</p>`,
      `<h2>2. Rate and Availability Notice</h2>
<p>Please be advised that all rates and availability are not guaranteed unless the reservation is ticketed.</p>`,
      `<h2>3. Baggage and Seat Information</h2>
<p>Before we proceed, I just want to let you know that:</p>
<ul style="text-align:left; display:inline-block;">
<li>Baggage fees are not included in the cost of the ticket and will be collected by the airline at the time of check-in.</li>
<li>Please double-check with the airline website prior to travel to confirm the proper check-in location.</li>
<li>You can assign your seat at the airline's website after we confirm your booking.</li>
<li>Pre-reserved seats may incur an additional fee and must be paid directly on the airline's website.</li>
<li>Travel restrictions and understanding of each country's policies are your own responsibility.</li>
</ul>`,
      `<h2>4. Payment Policy</h2>
<p>Before finalizing your payment, we'd like to make you aware of our policy. Once your ticket is confirmed and issued, we kindly ask that you wait at least 48 hours before making any changes. This policy is in place to ensure a seamless travel experience.</p>
<p>If you find a need for changes within that time frame, we recommend exploring the option of canceling your booking and rebooking to provide you with greater flexibility.</p>`,
      `<h2>5. Confirmation and Closing</h2>
<p>-We have successfully processed your reservation. You will be receiving a confirmation email, usually sent in real-time, but if there's a delay, that could take up to 24 to 48 hours.</p>
<p>-The booking ID is included in that email, or would you like to write it down?</p>
<p>-Before I let you go, is there anything else I can help you with?</p>
<p>If none--Dont forget if you have other concern, we are open 24/7; you can always call us back.</p>
<p>Survey--shortly after this call, you would receive an email regarding the service that you had receive from me today.</p>
<p>-i hope you find time to provide us feedback on how i assisted you. Thank you for calling travel centel. Have a wonderful day.</p>
<p>Close call.</p>`
    ];

    let mode = "home";
    let currentPage = 0;

    function renderPage() {
      const pageContent = document.getElementById("pageContent");
      const progressText = document.getElementById("progressText");
      const homeBtn = document.getElementById("homeBtn");
      const prevBtn = document.getElementById("prevBtn");
      const backBtn = document.getElementById("backBtn");
      const nextBtn = document.getElementById("nextBtn");
      const tipText = document.getElementById("tipText");

      if (mode === "home") {
        pageContent.innerHTML = homePage;
        progressText.textContent = "";
        homeBtn.style.display = "none";
        prevBtn.style.display = "none";
        backBtn.style.display = "none";
        nextBtn.style.display = "none";
        tipText.style.display = "none";
      } else if (mode === "hotel") {
        pageContent.innerHTML = hotelPage;
        progressText.textContent = "Hotel";
        homeBtn.style.display = "inline-block";
        prevBtn.style.display = "none";
        backBtn.style.display = "none";
        nextBtn.style.display = "none";
        tipText.style.display = "none";
      } else if (mode === "car") {
        pageContent.innerHTML = carPage;
        progressText.textContent = "Cars";
        homeBtn.style.display = "inline-block";
        prevBtn.style.display = "none";
        backBtn.style.display = "none";
        nextBtn.style.display = "none";
        tipText.style.display = "none";
      } else if (mode === "flight") {
        pageContent.innerHTML = flightPages[currentPage];
        progressText.textContent = `Flight - Step ${currentPage + 1} of ${flightPages.length}`;
        homeBtn.style.display = "inline-block";
        prevBtn.style.display = "inline-block";
        backBtn.style.display = "inline-block";
        nextBtn.style.display = "inline-block";
        tipText.style.display = "block";
        prevBtn.disabled = currentPage === 0;
        nextBtn.disabled = currentPage === flightPages.length - 1;
      }
    }

    function showHome() {
      mode = "home";
      currentPage = 0;
      renderPage();
    }

    function showHotel() {
      mode = "hotel";
      renderPage();
    }

    function showCar() {
      mode = "car";
      renderPage();
    }

    function showFlight() {
      mode = "flight";
      currentPage = 0;
      renderPage();
    }

    function nextPage() {
      if (mode === "flight" && currentPage < flightPages.length - 1) {
        currentPage++;
        renderPage();
      }
    }

    function prevPage() {
      if (mode === "flight" && currentPage > 0) {
        currentPage--;
        renderPage();
      }
    }

    function goToFirst() {
      if (mode === "flight") {
        currentPage = 0;
        renderPage();
      }
    }

    document.addEventListener("keydown", function(event) {
      if (mode === "flight") {
        if (event.key === "ArrowRight") {
          nextPage();
        } else if (event.key === "ArrowLeft") {
          prevPage();
        }
      }
    });

    renderPage();
  </script>
</body>
</html>
